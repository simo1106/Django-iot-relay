<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Relay 紀錄</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Relay 控制紀錄</h2>

    <a href="/" class="btn btn-primary mb-3">回控制頁</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>時間</th>
                <th>來源</th>
                <th>Topic</th>
                <th>Relay1</th>
                <th>Relay2</th>
                <th>Relay3</th>
                <th>Relay4</th>
            </tr>
        </thead>

        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.created_at|date:"Y-m-d H:i:s" }}</td>
                <td>{{ log.source }}</td>
                <td>{{ log.topic }}</td>
                <td>{{ log.relay1 }}</td>
                <td>{{ log.relay2 }}</td>
                <td>{{ log.relay3 }}</td>
                <td>{{ log.relay4 }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="7" class="text-center">目前沒有紀錄</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
