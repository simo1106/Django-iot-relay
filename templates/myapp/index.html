<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Relay 控制</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Relay 即時控制</h2>

    <div class="row" id="relay-area"></div>

    <div class="mt-4">
        <a href="/logs/" class="btn btn-secondary">查看紀錄</a>
    </div>
</div>

<script>
let relayState = {
    relay1: "off",
    relay2: "off",
    relay3: "off",
    relay4: "off"
};

function renderButtons() {
    let html = "";

    for (let i = 1; i <= 4; i++) {
        let key = "relay" + i;
        let status = relayState[key];
        let nextStatus = status === "on" ? "off" : "on";

        let btnClass = status === "on" ? "btn-danger" : "btn-success";
        let btnText = status === "on" ? "關閉" : "開啟";
        let badgeClass = status === "on" ? "bg-success" : "bg-secondary";

        html += `
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h4>Relay ${i}</h4>
                        <p>
                            狀態：
                            <span class="badge ${badgeClass}">
                                ${status}
                            </span>
                        </p>
                        <button class="btn ${btnClass}" onclick="toggleRelay('${key}', '${nextStatus}')">
                            ${btnText}
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    $("#relay-area").html(html);
}

function loadState() {
    $.get("/api/state/", function(data) {
        relayState = data;
        renderButtons();
    });
}

function toggleRelay(relayKey, status) {
    relayState[relayKey] = status;

    $.ajax({
        url: "/api/control/",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(relayState),
        success: function(res) {
            loadState();
        },
        error: function(err) {
            alert("控制失敗");
        }
    });
}

$(document).ready(function() {
    loadState();

    setInterval(function() {
        loadState();
    }, 1000);
});
</script>

</body>
</html>
